name: Claude Code plugin

on:
  push:
    branches: [main]
    paths: &paths
      - agents/**
      - claude/agents/**
      - .claude-plugin/plugin.json
      - scripts/build_claude_agents.py
      - .github/workflows/claude-plugin.yml
  pull_request:
    paths: *paths

jobs:
  # PRs must ship regenerated copies. On main, where cursor-skills-sync pushes
  # agents/ edits without running the script, regenerate and commit instead.
  agents-in-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'pull_request'
        run: python3 scripts/build_claude_agents.py --check
      - if: github.event_name == 'push'
        run: |
          python3 scripts/build_claude_agents.py
          git add claude/agents .claude-plugin/plugin.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Claude Code agents from agents/"
          git push
