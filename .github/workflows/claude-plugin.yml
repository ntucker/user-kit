name: Claude Code plugin

on:
  push:
    branches: [main]
    paths: &paths
      - agents/**
      - claude/agents/**
      - .claude-plugin/plugin.json
      - scripts/build_claude_agents.py
      - .github/workflows/claude-plugin.yml
  pull_request:
    paths: *paths

jobs:
  agents-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_claude_agents.py --check
